name: Native engine

# Cross-compiles OrcaSlicer's slicing core for Android. Slow (hours on a cold cache), so it only
# runs when native/ changes. Each engine is kept twice: in the Actions cache (fast, but deleted
# after 7 unused days) and as an engine-<native tree hash> pre-release, which never expires. The
# APK workflow and scripts/fetch-prebuilt-engine.sh use the cache first, then the release.
on:
  push:
    # Branches only: a release tag reuses the engine its commit already has.
    branches: ["**"]
    paths:
      - "native/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  # Native work happens on the runner's large scratch disk, outside the checkout.
  ORCAMICRO_WORK: /mnt/orcamicro

jobs:
  engine:
    name: Native engine (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    outputs:
      built: ${{ steps.need.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Reuse an engine built from the same native sources
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: native-out
          key: engine-v1-${{ hashFiles('native/**') }}

      - name: Reuse the released engine for these native sources
        id: released
        if: steps.engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/fetch-prebuilt-engine.sh native-out

      - name: Decide whether to build
        id: need
        run: |
          if [ "${{ steps.engine-cache.outputs.cache-hit }}" = "true" ] || [ "${{ steps.released.outcome }}" = "success" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare scratch disk and tools
        if: steps.need.outputs.build == 'true'
        run: |
          sudo mkdir -p "$ORCAMICRO_WORK" && sudo chown "$USER" "$ORCAMICRO_WORK"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build autoconf automake libtool ccache unzip patch
          df -h / /mnt

      - name: Set up the Android NDK
        if: steps.need.outputs.build == 'true'
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Fetch and patch OrcaSlicer
        if: steps.need.outputs.build == 'true'
        run: bash native/scripts/fetch-orca.sh

      - name: Restore built dependencies
        if: steps.need.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /mnt/orcamicro/prefix
          key: deps-v1-${{ github.run_id }}
          restore-keys: deps-v1-

      - name: Build dependencies
        id: deps
        if: steps.need.outputs.build == 'true'
        run: bash native/scripts/build-deps.sh

      - name: Name the dependency cache
        id: deps-key
        if: always() && steps.deps.outcome != 'skipped'
        run: echo "key=deps-v1-$(cat "$ORCAMICRO_WORK"/prefix/.stamps/* 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Saved even when a later dependency fails, so the next run resumes where this one stopped.
      - name: Save built dependencies
        if: always() && steps.deps.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /mnt/orcamicro/prefix
          key: ${{ steps.deps-key.outputs.key }}

      - name: Restore compiler cache
        if: steps.need.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /mnt/orcamicro/ccache
          key: ccache-v1-${{ github.run_id }}
          restore-keys: ccache-v1-

      - name: Build the engine
        id: build-engine
        if: steps.need.outputs.build == 'true'
        env:
          CCACHE_DIR: /mnt/orcamicro/ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: bash native/scripts/build-engine.sh native-out

      - name: Save compiler cache
        if: always() && steps.build-engine.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /mnt/orcamicro/ccache
          key: ccache-v1-${{ github.run_id }}

      - name: Publish the engine as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="engine-$(git rev-parse HEAD:native | cut -c1-12)"
          title="Slicing engine for app builds ($tag), not the app"
          notes="OrcaSlicer engine (arm64-v8a) built from native/ tree $(git rev-parse HEAD:native). This is not the app: to install OrcaMicro, download the APK from a vX.Y.Z release or the latest pre-release. Used by the APK build and scripts/fetch-prebuilt-engine.sh."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Keeps the wording of releases published before it changed.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            echo "$tag is already published"; exit 0
          fi
          (cd native-out && zip -qr "$RUNNER_TEMP/engine-arm64-v8a.zip" .)
          (cd "$RUNNER_TEMP" && sha256sum engine-arm64-v8a.zip > engine-arm64-v8a.zip.sha256)
          # Another run may publish the same tag first; that release is just as good.
          gh release create "$tag" "$RUNNER_TEMP/engine-arm64-v8a.zip" "$RUNNER_TEMP/engine-arm64-v8a.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$title" --notes "$notes" \
          || gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: engine-arm64-v8a
          path: native-out
          if-no-files-found: error

  # Only after compiling a new engine: the APK build started by the same push could not use it yet.
  # A reused engine was already there for that build, and a second build would cancel it.
  build-apk:
    name: Start the APK build
    needs: engine
    if: needs.engine.outputs.built == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
