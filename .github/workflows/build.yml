name: Build APK

# The Native engine workflow dispatches this one after it caches a new engine.
# Pushing a tag such as v1.1.0 publishes a versioned release that the in-app updater offers.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      built: ${{ steps.engine-ready.outputs.built }}
      signed: ${{ steps.signing.outputs.signed }}
      certificate: ${{ steps.certificate.outputs.sha256 }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the engine for these native sources
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: engine-v1-${{ hashFiles('native/**') }}
      - name: Add the cached engine to the app
        if: steps.engine.outputs.cache-hit == 'true'
        run: mkdir -p app/src/main/jniLibs && cp -r native-out/. app/src/main/jniLibs/
      # Caches are deleted after 7 unused days. The Native engine workflow also publishes each
      # engine as an engine-<native tree hash> pre-release, which never expires and works for forks.
      - name: Fetch the released engine for these native sources
        id: prebuilt
        if: steps.engine.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/fetch-prebuilt-engine.sh
      - name: Engine status
        id: engine-ready
        run: |
          if [ "${{ steps.engine.outputs.cache-hit }}" = "true" ] || [ "${{ steps.prebuilt.outcome }}" = "success" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No engine is available for these native sources, so the APK is only compiled. The Native engine workflow builds the engine and then runs this workflow again."
          fi
      - name: Fetch OrcaSlicer profiles
        run: ORCAMICRO_ORCA_DIR="$RUNNER_TEMP/orca" bash native/scripts/fetch-orca.sh --profiles-only
      # A v* tag sets the version name; otherwise the default in app/build.gradle.kts applies.
      # The version code only has to grow, so it follows the run number.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name=""; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
      # The release key lives only in the repository's secrets. Without them (forks, pull
      # requests, or before the secrets are added) the release APK gets a throwaway debug key
      # and is never published.
      - name: Release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ORCAMICRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::The ORCAMICRO_KEYSTORE_BASE64 secret is not set, so the release APK is signed with a throwaway debug key and will not be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ORCAMICRO_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests and APKs
        env:
          ORCAMICRO_KEYSTORE_PASSWORD: ${{ secrets.ORCAMICRO_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          sh ./gradlew :core:test :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          -PorcaResourcesDir="$RUNNER_TEMP/orca/resources"
          -PsourceUrl="https://github.com/$GITHUB_REPOSITORY"
          -PappVersionCode="${{ steps.version.outputs.code }}"
          ${VERSION_NAME:+-PappVersionName=$VERSION_NAME}
          --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: core/build/reports/tests
      - name: Collect APKs
        if: steps.engine-ready.outputs.built == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OrcaMicro.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/OrcaMicro-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/OrcaMicro-tests.apk
          ls -l dist
      - name: Check the release signature
        id: certificate
        if: steps.engine-ready.outputs.built == 'true' && steps.signing.outputs.signed == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs dist/OrcaMicro.apk | tee certificate.txt
          echo "sha256=$(sed -n 's/.*certificate SHA-256 digest: //p' certificate.txt | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.engine-ready.outputs.built == 'true'
        with:
          name: OrcaMicro-apk
          path: dist/OrcaMicro.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.engine-ready.outputs.built == 'true'
        with:
          name: smoke-test-apks
          path: |
            dist/OrcaMicro-debug.apk
            dist/OrcaMicro-tests.apk

  smoke:
    name: Engine smoke test (emulator)
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-test-apks
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # x86_64 images from API 30 on translate arm64 apps, so the arm64 engine runs here.
      - name: Slice test models on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            adb install -r dist/OrcaMicro-debug.apk
            adb install -r dist/OrcaMicro-tests.apk
            adb shell am instrument -w io.github.whoxllm.orcamicro.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "^OK (" instrument.txt

  release:
    name: Publish the APK
    needs: [build, smoke]
    # Only APKs signed with the release key: the default branch updates the rolling "latest"
    # pre-release, and a v* tag publishes the versioned release the in-app updater looks for.
    if: >-
      needs.build.outputs.built == 'true' && needs.build.outputs.signed == 'true' &&
      github.event_name == 'push' &&
      (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OrcaMicro-apk
          path: dist
      - name: Update the "latest" pre-release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE: ${{ needs.build.outputs.certificate }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/OrcaMicro.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "OrcaMicro (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. The slicing engine passed the emulator smoke test. Install OrcaMicro.apk on an Android 14+ ARM64 phone. Signing certificate SHA-256: ${CERTIFICATE}"
      # The updater accepts only this asset name, from this repository, with GitHub's SHA-256 digest.
      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CERTIFICATE: ${{ needs.build.outputs.certificate }}
        run: |
          apk="dist/OrcaMicro-arm64-v${VERSION}.apk"
          mv dist/OrcaMicro.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OrcaMicro ${VERSION}" --generate-notes \
            --notes "Install on an Android 14+ ARM64 phone. Signing certificate SHA-256: ${CERTIFICATE}"
