name: Build APK

# The Native engine workflow dispatches this one after it caches a new engine.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch OrcaSlicer profiles
        run: ORCAMICRO_ORCA_DIR="$RUNNER_TEMP/orcaslicer" bash native/scripts/fetch-orca.sh --profiles-only
      - name: Run tests
        run: sh ./gradlew :core:test -PcoreOnly -PorcaResourcesDir="$RUNNER_TEMP/orcaslicer/resources" --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-report
          path: core/build/reports/tests

  apk:
    name: APK
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      built: ${{ steps.engine.outputs.cache-hit }}
      signed: ${{ steps.signing.outputs.signed }}
      certificate: ${{ steps.certificate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the engine for these native sources
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: engine-v1-${{ hashFiles('native/**') }}
      - name: Engine not built yet
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          echo "::notice::No native engine is cached for these sources yet, so the APK is only compiled. The Native engine workflow builds the engine and then runs this workflow again."
          echo "Compiled without the engine; waiting for the Native engine workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Add the engine to the app
        if: steps.engine.outputs.cache-hit == 'true'
        run: mkdir -p app/src/main/jniLibs && cp -r native-out/. app/src/main/jniLibs/ && ls -lR app/src/main/jniLibs
      - name: Fetch OrcaSlicer profiles
        run: ORCAMICRO_ORCA_DIR="$RUNNER_TEMP/orcaslicer" bash native/scripts/fetch-orca.sh --profiles-only
      # The release key lives only in the repository's secrets. Without them (forks, or before
      # the secrets are added) the release APK gets a throwaway debug key and is never published.
      - name: Release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ORCAMICRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::The ORCAMICRO_KEYSTORE_BASE64 secret is not set, so the release APK is signed with a throwaway debug key and will not be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ORCAMICRO_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          ORCAMICRO_KEYSTORE_PASSWORD: ${{ secrets.ORCAMICRO_KEYSTORE_PASSWORD }}
        run: >
          sh ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          -PorcaResourcesDir="$RUNNER_TEMP/orcaslicer/resources" --stacktrace
      - name: Collect APKs
        if: steps.engine.outputs.cache-hit == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OrcaMicro.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/OrcaMicro-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/OrcaMicro-tests.apk
          ls -l dist
      - name: Check the release signature
        id: certificate
        if: steps.engine.outputs.cache-hit == 'true' && steps.signing.outputs.signed == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs dist/OrcaMicro.apk | tee certificate.txt
          echo "sha256=$(sed -n 's/.*certificate SHA-256 digest: //p' certificate.txt | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.engine.outputs.cache-hit == 'true'
        with:
          name: OrcaMicro-apk
          path: dist/OrcaMicro.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.engine.outputs.cache-hit == 'true'
        with:
          name: smoke-test-apks
          path: |
            dist/OrcaMicro-debug.apk
            dist/OrcaMicro-tests.apk

  smoke:
    name: Engine smoke test (emulator)
    needs: apk
    if: needs.apk.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-test-apks
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # x86_64 images from API 30 on translate arm64 apps, so the arm64 engine runs here.
      - name: Slice test models on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            adb install -r dist/OrcaMicro-debug.apk
            adb install -r dist/OrcaMicro-tests.apk
            adb shell am instrument -w io.github.whoxllm.orcamicro.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "^OK (" instrument.txt

  release:
    name: Publish the APK
    needs: [apk, smoke]
    # Only APKs signed with the release key, and only from the default branch.
    if: >-
      needs.apk.outputs.built == 'true' && needs.apk.outputs.signed == 'true' &&
      github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OrcaMicro-apk
          path: dist
      # One rolling pre-release that always holds the newest APK that passed the smoke test.
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE: ${{ needs.apk.outputs.certificate }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/OrcaMicro.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "OrcaMicro (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. The slicing engine passed the emulator smoke test. Install OrcaMicro.apk on an Android 9+ ARM64 phone. Signing certificate SHA-256: ${CERTIFICATE}"
